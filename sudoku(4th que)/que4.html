<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
body {
    font-family: Arial, sans-serif;
    margin: 25px;
}

.main {
    display: flex;
    justify-content: center;
    gap: 40px;
    flex-wrap: wrap;
}

.box {
    width: 370px;
}

h2 {
    text-align: center;
    font-size: 28px;
    
    
    margin-bottom: 25px;
}

.grid {
    display: flex;
    flex-direction: column;
    border: 2px solid black;
}

.section {
    display: flex;
    flex-direction: column;
    border-bottom: 3px solid black;
}

.section:last-child {
    border-bottom: none;
}

.row {
    display: flex;
}

.group {
    display: flex;
    flex: 1;
    border-right: 3px solid black;
}

.group:last-child {
    border-right: none;
}

.group div {
    flex: 1;
    height: 40px;
    box-sizing: border-box;
    border: 1px solid #999;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 22px;
}

.green-group div {
    background-color: #a8d5b8;
}
</style>
</head>
<body>
