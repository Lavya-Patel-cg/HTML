<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background-color: black;
        }
      *{
        
        margin: 0;
        padding: 0;
       
      }
      .main{
        background-image:url("Title-image.png");
        background-size: cover;
        background-repeat: no-repeat;
        height: 100vh;
        width: 100%;
      }
      .navbar{
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px 20px;
      }
      .list{
        list-style-type: none;
        display: flex;
        gap: 10px; 
        text-decoration: none;
        color: white;
      }
      .items2{
        display:flex;
        gap: 15px;
      }
      .list{
        display: flex;
        gap: 15px;
        color:black;
        margin-left:-850px
      }
      .middle{
        display:flex;
        flex-direction: column;
        margin-left: 90px;
        margin-top: 350px;
        justify-content: flex-start;

      }
      .first{
        display:flex;
        gap: 10px;
        align-items: center;
        font-size: 15px;
        color: white;
        margin-left:10px;

      }
      .second{
        font-size: 110px;
        color: white;
        margin-top: 10px;
        font-weight: bold;
      }
      .third{
        display:flex;
        gap: 10px;
        margin-top: 20px;
      }
      button{
        background-color: gray;
        color: black;
        border: none;
        padding: 10px 20px;
        border-radius: 5px;
        font-size: 16px;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .btn{
        background-color: white;
        color: black;
        border: none;
        padding: 10px 20px;
        border-radius: 5px;
        font-size: 16px;
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 10px;
      } 
      .firstline{
        display:flex;
        flex-direction: column;
        margin-left: 90px;
        margin-top: 50px;
      }
      .firstitems{
        display:flex;
        gap: 10px;
        margin-top: 20px;
        
      }
      .see{
        display:flex;
        gap: 10px;
        align-items: center;
        color: white;
        font-size: 20px;
        margin-top: 20px;
      }
      .seconditems{
        display:flex;
        gap: 15px;
        margin-top: 20px;
        margin-left:-25px
      }
      .footimage{
        display: flex;
        justify-content: center;
        align-items: center; 
        width: 100%;
        margin-top: 20px; 

      }
      
    </style>
</head>
<body>
    <div class="main">
        <nav class="navbar">

            <div class="items2">

            </div>
        </div>

        <div class="firstline">

        <div class="firstline">

                <div class="thumbnail2"><img src="Rank - 05.png" alt=""><img src="section 2.5.png" alt=""></div>

        <div class="firstline">

                <div class="thumbnail1"><img src="section 3.1.png" alt=""></div>
                <div class="thumbnail1"><img src="section 3.2.png" alt=""></div>
                <div class="thumbnail1"><img src="section 3.3.png" alt=""></div>
                <div class="thumbnail1"><img src="section 3.4.png" alt=""></div>
                <div class="thumbnail1"><img src="section 3.5.png" alt=""></div>
            </div>
        </div>


         <div class="firstline">

                <div class="thumbnail1"><img src="section 4.2.png" alt=""></div>
                <div class="thumbnail1"><img src="section 4.3.png" alt=""></div>

</html>
